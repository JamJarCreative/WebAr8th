<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <title>WebAr8th</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      /* 8th Wall draws the camera feed on #xr-canvas; Unity renders on top with a transparent clear. */
      #xr-canvas, #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
      #xr-canvas { z-index: 0; }
      #unity-canvas { z-index: 1; background: transparent; touch-action: none; }
    </style>
    <script src="TemplateData/xr/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
    <!-- xr.js only imports the tracking chunk once it has run; start that download alongside it. -->
    <link rel="modulepreload" href="TemplateData/xr/xr-tracking.js" crossorigin="anonymous">
    <script>
      // Phones report 3x+; rendering both canvases at that density costs far more than it shows.
      window.arPixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    </script>
    <style>
      #debug-panel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-height: 40%; overflow-y: auto;
        margin: 0; padding: 6px; background: rgba(0, 0, 0, 0.75); color: #0f0; font: 11px/1.3 monospace; white-space: pre-wrap; }
      #debug-toggle { position: fixed; right: 8px; top: 8px; z-index: 11; padding: 8px 12px; font: 13px sans-serif; }
    </style>
    <script>
      // Open the page with ?debug on a phone to see warnings and errors on screen, and to hide the
      // Unity canvas so you can tell whether the camera feed underneath is drawing at all.
      if (/[?&]debug\b/.test(location.search)) {
        window.addEventListener("DOMContentLoaded", function () {
          var panel = document.createElement("pre");
          panel.id = "debug-panel";
          document.body.appendChild(panel);

          var toggle = document.createElement("button");
          toggle.id = "debug-toggle";
          toggle.textContent = "Hide Unity";
          toggle.onclick = function () {
            var canvas = document.getElementById("unity-canvas");
            var hidden = canvas.style.visibility === "hidden";
            canvas.style.visibility = hidden ? "visible" : "hidden";
            toggle.textContent = hidden ? "Hide Unity" : "Show Unity";
          };
          document.body.appendChild(toggle);
        });

        var pending = [];
        window.debugLog = function (text) {
          var panel = document.getElementById("debug-panel");
          if (panel) {
            panel.textContent += text + "\n";
            panel.scrollTop = panel.scrollHeight;
          } else {
            pending.push(text);
          }
        };
        window.addEventListener("DOMContentLoaded", function () {
          pending.forEach(window.debugLog);
        });

        ["warn", "error"].forEach(function (level) {
          var original = console[level];
          console[level] = function () {
            window.debugLog(level.toUpperCase() + ": " + Array.prototype.join.call(arguments, " "));
            original.apply(console, arguments);
          };
        });
        window.addEventListener("error", function (event) {
          window.debugLog("ERROR: " + event.message + " (" + event.filename + ":" + event.lineno + ")");
        });
        window.addEventListener("unhandledrejection", function (event) {
          window.debugLog("REJECTED: " + event.reason);
        });
      }
    </script>
    <!-- Written by Tools > 8th Wall > Loading Screen > Export To WebGL Template. -->
    <link rel="stylesheet" href="TemplateData/loading/loading.css">
  </head>
  <body>
    <!-- web-loading-screen:begin -->
    <div id="web-loading-screen" data-scale-mode="screen" data-ref-width="1080" data-ref-height="1920" data-match-mode="match" data-match="0.5" data-fade="0.4" data-wait-for-hide="false">
      <div id="wl-0" class="wl">
      </div>
      <div id="wl-1" class="wl wl-text">
        <span>WebAr8th</span>
      </div>
      <div id="wl-2" class="wl">
        <div id="wl-3" class="wl">
        </div>
      </div>
      <div id="wl-4" class="wl wl-text">
        <span>Loading <span class="wl-progress">0</span>%</span>
      </div>
      <div id="wl-5" class="wl wl-text">
        <span>Jam Creative Studios</span>
      </div>
    </div>
    <!-- web-loading-screen:end -->
    <script src="TemplateData/web-loading.js"></script>
    <canvas id="xr-canvas"></canvas>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <script>
      // The engine expects its canvas drawing buffer to match the window; Unity sizes its own canvas.
      function resizeXrCanvas() {
        var canvas = document.getElementById("xr-canvas");
        var ratio = window.arPixelRatio;
        canvas.width = Math.round(window.innerWidth * ratio);
        canvas.height = Math.round(window.innerHeight * ratio);
      }
      resizeXrCanvas();
      window.addEventListener("resize", resizeXrCanvas);
    </script>
    <script src="Build/WebAr8thBuild.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/WebAr8thBuild.data.unityweb",
        frameworkUrl: "Build/WebAr8thBuild.framework.js.unityweb",
        codeUrl: "Build/WebAr8thBuild.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Jam Creative Studios",
        productName: "WebAr8th",
        productVersion: "0.0.4",
        webglContextAttributes: { premultipliedAlpha: true, preserveDrawingBuffer: false },
        devicePixelRatio: window.arPixelRatio,
      }, function (progress) {
        window.setWebLoadingProgress(progress);
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        window.setWebLoadingProgress(1);
        // Otherwise the scene hides it via WebLoadingScreen.Hide() (e.g. once AR has started).
        if (!window.webLoadingWaitsForScene) {
          window.hideWebLoadingScreen();
        }
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
